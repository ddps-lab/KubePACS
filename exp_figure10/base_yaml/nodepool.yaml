apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: nodepool-worker
spec:
  template:
    metadata:
      labels:
        lithops/nodetype: spot
        kubecaps/node: worker
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
      nodeClassRef:
        name: nodeclass-worker
        group: karpenter.k8s.aws
        kind: EC2NodeClass
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m0s
