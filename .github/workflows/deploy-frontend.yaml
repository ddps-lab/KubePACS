name: Deploy KubePACS Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-frontend.yaml
      - frontend/**

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  FRONTEND_DIR: frontend
  S3_BUCKET: kubepacs.ddps.cloud
  CLOUDFRONT_DISTRIBUTION_ID: E33W0BVG8FRMS2
  DEPLOY_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
  DEPLOY_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_KEY }}
  DEPLOY_AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  DEPLOY_AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

      - name: Build static site
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Configure AWS credentials with access keys
        if: ${{ env.DEPLOY_AWS_ACCESS_KEY_ID != '' && env.DEPLOY_AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.DEPLOY_AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with OIDC
        if: ${{ env.DEPLOY_AWS_ROLE_ARN != '' && (env.DEPLOY_AWS_ACCESS_KEY_ID == '' || env.DEPLOY_AWS_SECRET_ACCESS_KEY == '') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS credentials
        run: aws sts get-caller-identity

      - name: Sync immutable Next assets
        run: |
          aws s3 sync "$FRONTEND_DIR/out/_next/static" "s3://$S3_BUCKET/_next/static" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync site files
        run: |
          aws s3 sync "$FRONTEND_DIR/out" "s3://$S3_BUCKET" \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
