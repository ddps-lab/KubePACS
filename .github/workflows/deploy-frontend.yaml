name: Deploy KubePACS Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-frontend.yaml
      - frontend/**

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  FRONTEND_DIR: frontend
  S3_BUCKET: kubepacs.ddps.cloud
  CLOUDFRONT_DISTRIBUTION_ID: E33W0BVG8FRMS2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

      - name: Build static site
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.HYU_DDPS_AWS_ID }}
          aws-secret-access-key: ${{ secrets.HYU_DDPS_AWS_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS credentials
        run: aws sts get-caller-identity

      - name: Sync immutable Next assets
        run: |
          aws s3 sync "$FRONTEND_DIR/out/_next/static" "s3://$S3_BUCKET/_next/static" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync site files
        run: |
          aws s3 sync "$FRONTEND_DIR/out" "s3://$S3_BUCKET" \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Verify S3 content types
        run: |
          html_type="$(aws s3api head-object --bucket "$S3_BUCKET" --key index.html --query ContentType --output text)"
          css_key="$(find "$FRONTEND_DIR/out/_next/static" -name '*.css' -printf '%P\n' | head -n 1)"
          js_key="$(find "$FRONTEND_DIR/out/_next/static" -name '*.js' -printf '%P\n' | head -n 1)"

          css_type="$(aws s3api head-object --bucket "$S3_BUCKET" --key "_next/static/$css_key" --query ContentType --output text)"
          js_type="$(aws s3api head-object --bucket "$S3_BUCKET" --key "_next/static/$js_key" --query ContentType --output text)"

          case "$html_type" in
            text/html*) ;;
            *) echo "Unexpected Content-Type for index.html: $html_type"; exit 1 ;;
          esac
          case "$css_type" in
            text/css*) ;;
            *) echo "Unexpected Content-Type for _next/static/$css_key: $css_type"; exit 1 ;;
          esac
          case "$js_type" in
            application/javascript*|text/javascript*) ;;
            *) echo "Unexpected Content-Type for _next/static/$js_key: $js_type"; exit 1 ;;
          esac

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
