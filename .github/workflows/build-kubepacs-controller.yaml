name: Build KubePACS Controller Image

# Branch pushes build both platforms and smoke-test the solver without publishing.
# Run manually with a tag to push a multi-arch image to GHCR (never tags `latest`).
on:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/build-kubepacs-controller.yaml
      - KubePACS_with_Karpenter/**
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push (e.g. 1.14.0-kubepacs-rc1)
        required: true

permissions:
  contents: read
  packages: write

env:
  CONTROLLER_IMAGE: ghcr.io/ddps-lab/kubepacs-karpenter-controller

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: KubePACS_with_Karpenter/karpenter-core/go.mod
          cache-dependency-path: |
            KubePACS_with_Karpenter/karpenter-core/go.sum
            KubePACS_with_Karpenter/karpenter-provider-aws/go.sum

      - name: Unit tests
        run: |
          (cd KubePACS_with_Karpenter/karpenter-core && go vet ./pkg/controllers/provisioning/scheduling/ \
            && go test ./pkg/controllers/provisioning/scheduling/ -run TestKubepacs -v)
          (cd KubePACS_with_Karpenter/karpenter-provider-aws && go test ./pkg/cache/)

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test each platform
        run: |
          for arch in amd64 arm64; do
            docker buildx build \
              --platform "linux/${arch}" \
              --cache-from type=gha,scope="${arch}" \
              --cache-to type=gha,mode=max,scope="${arch}" \
              --load \
              -t "kubepacs-controller:${arch}" \
              -f KubePACS_with_Karpenter/karpenter-provider-aws/Dockerfile \
              KubePACS_with_Karpenter
            docker run --rm --platform "linux/${arch}" --entrypoint sh "kubepacs-controller:${arch}" -c '
              set -e
              test -x /controller
              test -f /usr/local/bin/kubepacs_cli.py
              test -f /usr/local/bin/aws_coremark_singlecore.csv
              cd /tmp
              python3 -c "
          import pulp
          p = pulp.LpProblem(\"smoke\", pulp.LpMinimize)
          x = pulp.LpVariable(\"x\", lowBound=0, cat=\"Integer\")
          p += x
          p += x >= 1
          assert p.solve(pulp.PULP_CBC_CMD(msg=0)) == 1, \"CBC failed\"
          print(\"CBC ok\", pulp.value(x))
          "'
          done

      - if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: KubePACS_with_Karpenter
          file: KubePACS_with_Karpenter/karpenter-provider-aws/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          tags: |
            ${{ env.CONTROLLER_IMAGE }}:${{ inputs.tag }}
            ${{ env.CONTROLLER_IMAGE }}:sha-${{ github.sha }}
