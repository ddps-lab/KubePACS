# Minimal values for installing KubePACS with Karpenter on an existing EKS cluster.
# Fill every placeholder before running helm install/upgrade.

imagePullPolicy: Always

settings:
  clusterName: "<eks-cluster-name>"
  clusterEndpoint: "<https://eks-cluster-endpoint>"
  interruptionQueue: "<karpenter-interruption-queue-name>"
  kubepacs:
    enabled: true
    strategyAnnotation: kubepacs.io/strategy
    strategyValue: kubepacs
    scenarioInstanceLabel: kubepacs-scenario-instance
    solverPath: /usr/local/bin/kubepacs_cli.py

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "<karpenter-controller-role-arn>"

controller:
  env:
    - name: AWS_REGION
      value: "<region>"

kubepacsNodeClass:
  enabled: true
  name: default
  role: "<karpenter-node-role-name>"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<eks-cluster-name>"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<eks-cluster-name>"
  amiSelectorTerms:
    - alias: al2023@latest

kubepacsNodePool:
  enabled: true
  name: default
  nodeClassRef:
    group: karpenter.k8s.aws
    kind: EC2NodeClass
    name: default
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
  limits:
    cpu: 1000
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m

kubepacsVerification:
  enabled: false
