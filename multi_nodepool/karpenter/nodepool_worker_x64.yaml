apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: nodepool-worker-x64
spec:
  template:
    metadata:
      labels:
        lithops/nodetype: spot
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
      nodeClassRef:
        name: nodeclass-worker-x64
        group: karpenter.k8s.aws
        kind: EC2NodeClass
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m0s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: nodeclass-worker-x64
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - id: "ami-07f82ae3f51876a3c"
  # change plz
  role: "kubecaps-d2-karpenter-node-role-20250505053122000400000005" # replace with your cluster name
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "kubecaps-d2-k8s-cluster" # replace with your cluster name
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "kubecaps-d2-k8s-cluster"
