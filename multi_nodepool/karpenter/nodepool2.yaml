apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: nodepool2
spec:
  template:
    metadata:
      labels:
        lithops/jobname: job1
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t2.medium"]
      nodeClassRef:
        name: nodeclass2
        group: karpenter.k8s.aws
        kind: EC2NodeClass
  limits:
    cpu: 4
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m0s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: nodeclass2
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - id: "ami-07f82ae3f51876a3c"
  # change plz
  role: "mhsong-karpenter-node-role-20250428064044057000000005" # replace with your cluster name
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "mhsong-k8s-cluster" # replace with your cluster name
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "mhsong-k8s-cluster"