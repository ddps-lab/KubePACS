apiVersion: batch/v1
kind: Job
metadata:
  name: myjob
spec:
  parallelism: 2
  completions: 2
  ttlSecondsAfterFinished: 100
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: lithops/nodetype
                    operator: In
                    values:
                      - spot
                  - key: kubecaps/node
                    operator: In
                    values:
                      - worker
      containers:
        - name: pi
          image: perl
          command:
            ["sh", "-c", "perl -Mbignum=bpi -wle 'print bpi(2000)'; sleep 60"]
          resources:
            requests:
              memory: "8000Mi"
              cpu: "900m"
            limits:
              memory: "8000Mi"
              cpu: "900m"
      restartPolicy: Never
