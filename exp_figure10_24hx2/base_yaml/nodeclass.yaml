apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: nodeclass-worker
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - alias: bottlerocket@v1.37.0
  tags:
    kubecaps: none
  # change plz
  role: "kubecaps-d2-karpenter-node-role-2025052005252659220000001d" # replace with your cluster name
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "kubecaps-d2-k8s-cluster" # replace with your cluster name
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "kubecaps-d2-k8s-cluster"
